services:
  unbound-gym:
    build: .
    container_name: unbound-gym
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET:-change-this-secret-in-production}
    volumes:
      - ./data:/app/data
      - ./crossfit.db:/app/crossfit.db
      - ./uploads:/app/public/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/login', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - gym-network

networks:
  gym-network:
    driver: bridge
